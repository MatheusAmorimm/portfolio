name: CI

on:
  push:
    branches: [main]
  pull_request:

# Um push novo cancela a execução anterior do mesmo branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, types, testes e build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # Corepack ativa o Yarn 4 declarado em packageManager no package.json.
      # Precisa vir antes do setup-node, que usa o yarn para montar o cache.
      - name: Habilitar Corepack
        run: corepack enable

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: yarn

      # --immutable falha se o yarn.lock precisaria mudar. Em CI isso é o
      # comportamento correto: lockfile desatualizado é erro, não conserto
      # silencioso.
      - name: Instalar dependências
        run: yarn install --immutable

      - name: Lint
        run: yarn lint

      - name: Checagem de tipos
        run: yarn typecheck

      # Inclui o teste de contraste, que lê o globals.css real e falha se
      # qualquer par de cores cair abaixo de WCAG AA.
      - name: Testes
        run: yarn test

      # A build é onde a validação de conteúdo roda. Última porque é a mais
      # lenta — os passos baratos falham primeiro.
      - name: Build de produção
        run: yarn build
